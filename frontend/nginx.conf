server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_read_timeout 360s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
