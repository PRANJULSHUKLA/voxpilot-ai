name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voxpilot
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: voxpilot
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U voxpilot' --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: ruff check --config backend/pyproject.toml backend scripts
      - run: python -m pytest -q
        working-directory: backend
      - name: PostgreSQL migration and mocked workflows
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://voxpilot:ci-only@localhost:5432/voxpilot
          GEMINI_API_KEY: ''
        run: |
          python -m alembic upgrade head
          python tests/postgres_smoke.py
      - name: Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
